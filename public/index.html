<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pixel Party</title>
<style>
  html,body{margin:0;height:100%;background:#0d0b1e;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;max-width:100vw;max-height:100vh}
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  #touch.on{display:block}
  #stick{position:absolute;left:3vmin;bottom:4vmin;width:30vmin;height:30vmin;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:12vmin;height:12vmin;margin:-6vmin 0 0 -6vmin;border-radius:50%;background:rgba(255,255,255,.35)}
  .btn{position:absolute;width:15vmin;height:15vmin;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);color:#fff;font:bold 6vmin monospace;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
  #bA{right:4vmin;bottom:8vmin;background:rgba(61,220,132,.28)}
  #bB{right:21vmin;bottom:3vmin;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="270"></canvas></div>
<div id="touch"><div id="stick"><div id="knob"></div></div><div class="btn" id="bB">B</div><div class="btn" id="bA">A</div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
